# Built-in sound effects. Times are seconds, frequencies Hz.
# The file is kept as a save writes it (audio.SaveSoundsFile): keys sorted, each
# layer, chain and source a block, each tone a Tone invocation. After a hand
# edit, go test ./bank -resave writes it so again.

[macros.Tone]
doc = "A Simon tone at freq: a sine under a low-passed square, one take at concert pitch"
params = { name = "string", freq = "float" }
body = { name = "${name}", duration = 0.42, fixed_length = true, variants = 1, pitch_walk = 0.0001, norm = 0.85, chain = [{ kind = "ar", attack = 0.008, release = 0.14 }], layer = [
  { source = { kind = "osc", wave = "sine", freq = "${freq}" } },
  { gain = 0.35, source = { kind = "osc", wave = "square", freq = "${freq}" }, chain = [{ kind = "lp", freq = 1400, q = 0.707 }] },
] }

