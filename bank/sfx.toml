[[sound.layer]]

[[sound.layer.chain]]
depth = 0.55
kind = "am"
phase = 0.5
rate = 2.5

[sound.layer.source]
freq = 660.0
kind = "osc"
wave = "sine"

[sound.layer.source.vibrato]
