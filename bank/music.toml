# Built-in music patterns. A step is a sixteenth, sixteen to a bar, and a 64-step
# pattern the four bars of the chord progression. vel, prob and humanize are 0..1;
# deg is a scale degree, from the bar's chord root on a chord-following track, and
# oct an octave above the harmony root. role, groups, tiers and motif place a
# pattern in the drawn music (doc/audio.md §7). Macros: lixenwraith/toml's README.

[macros.Hit]
doc = "One drum hit at pos; prob under 1 makes it a chance hit, late sounds it that share of a step after"
params = { pos = "int", vel = "float", prob = "float", late = "float" }
defaults = { prob = 0, late = 0 }
body = { pos = "${pos}", vel = "${vel}", prob = "${prob}", late = "${late}" }

[macros.Drum]
doc = "A drum lane: instr at every pos, its vel, prob and late each one value or one a hit"
params = { instr = "string", pos = "array", vel = "any", humanize = "float", prob = "any", late = "any" }
defaults = { humanize = 0.4, prob = 0, late = 0 }
body = { instr = "${instr}", humanize = "${humanize}", event = [
  { macro = "Hit", each = { pos = "${pos}", vel = "${vel}", prob = "${prob}", late = "${late}" } },
] }

[macros.Kick4]
doc = "Four-on-the-floor kick over a bar"
base = "Drum"
defaults = { vel = 1.0 }
with = { instr = "kick", pos = [0, 4, 8, 12], humanize = 0 }

[macros.Kick8]
doc = "Four-on-the-floor kick over two bars"
base = "Drum"
defaults = { vel = 1.0 }
with = { instr = "kick", pos = [0, 4, 8, 12, 16, 20, 24, 28], humanize = 0 }

[macros.Kick16]
doc = "Four-on-the-floor kick over four bars"
base = "Drum"
defaults = { vel = 1.0 }
with = { instr = "kick", pos = [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60], humanize = 0 }

[macros.Note]
doc = "One note: pos, deg, dur in steps, vel, oct above the root; acc the semitones off the degree, late the share of a step it sounds after pos, bend the semitones it glides by its end from bend_at of its length, prob its chance"
params = { pos = "int", deg = "int", dur = "int", vel = "float", oct = "int", acc = "int", late = "float", bend = "float", bend_at = "float", prob = "float" }
defaults = { deg = 0, dur = 1, vel = 0.5, oct = 2, acc = 0, late = 0, bend = 0, bend_at = 0, prob = 0 }
body = { pos = "${pos}", deg = "${deg}", dur = "${dur}", vel = "${vel}", oct = "${oct}", acc = "${acc}", late = "${late}", bend = "${bend}", bend_at = "${bend_at}", prob = "${prob}" }

[macros.Line]
doc = "A line on instr: a note per pos, its deg, dur, vel, acc, late, bend, bend_at and prob each one value or one a note; follow reads deg from the chord"
params = { instr = "string", pos = "array", deg = "any", dur = "any", vel = "any", oct = "int", follow = "bool", humanize = "float", acc = "any", late = "any", bend = "any", bend_at = "any", prob = "any" }
defaults = { vel = 0.5, oct = 2, follow = true, humanize = 0.25, acc = 0, late = 0, bend = 0, bend_at = 0, prob = 0 }
body = { instr = "${instr}", follow_chord = "${follow}", humanize = "${humanize}", event = [
  { macro = "Note", each = { pos = "${pos}", deg = "${deg}", dur = "${dur}", vel = "${vel}", acc = "${acc}", late = "${late}", bend = "${bend}", bend_at = "${bend_at}", prob = "${prob}" }, oct = "${oct}" },
] }

[macros.Lead]
doc = "A lead line in absolute degrees of the key, so it reads across the progression"
base = "Line"
defaults = { instr = "lead" }
with = { follow = false, humanize = 0.25 }

[macros.Chord]
doc = "A chord of degs at one pos"
params = { pos = "int", deg = "array", dur = "int", vel = "float", oct = "int" }
defaults = { dur = 1, vel = 0.4, oct = 2 }
body = [{ macro = "Note", each = { deg = "${deg}" }, pos = "${pos}", dur = "${dur}", vel = "${vel}", oct = "${oct}" }]

# ---------------------------------------------------------------------------
# rolling: four-on-the-floor kick over the psytrance k-b-b-b sixteenth bass.

